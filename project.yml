# After editing this file run `xcodegen generate`; the .xcodeproj is not committed.
# Build for the simulator with signing on: with CODE_SIGNING_ALLOWED=NO WKWebView loads blank pages.
name: Zen
options:
  bundleIdPrefix: com.malinatrash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FirefoxSyncKit:
    path: Packages/FirefoxSyncKit
targets:
  Zen:
    type: application
    platform: iOS
    sources:
      - Zen
    dependencies:
      - package: FirefoxSyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malinatrash.zen
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
